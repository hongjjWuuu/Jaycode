name: Jaycode quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,vector]"
      - run: python -m pip install pip-audit
      - run: pip-audit
      - run: ruff check app tests
      - run: pytest -q tests -m "not postgres"
      - run: python -m app.benchmark_runner --type rag-gold --output artifacts/rag-gold-result.json
      - run: python scripts/check_rag_gold_baseline.py artifacts/rag-gold-result.json
      - run: python scripts/worker_load_test.py --tasks 100 --workers 2
      - run: python -m app.persistence.migrate --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Scan legacy markers
        shell: bash
        run: |
          ! grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=__pycache__ \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.pyc' \
            'F:/JayAgent/Jaycode|F:\\JayAgent\\Jaycode|DevAgent|devagent|x_devagent' \
            README.md docs app web/src examples scripts tests

  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jaycode
          POSTGRES_PASSWORD: jaycode-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jaycode -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JAYCODE_TEST_ADMIN_URL: postgresql://jaycode:jaycode-ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,vector]"
      - run: python scripts/run_postgres_contracts.py
